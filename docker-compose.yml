# AgentSync — local development services
services:
  redis:
    image: redis:7-alpine
    container_name: agentsync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - agentsync-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentsync-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentsync-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentsync-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - agentsync-net

volumes:
  redis_data:

networks:
  agentsync-net:
    driver: bridge
