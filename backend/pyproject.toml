[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsync-backend"
version = "0.1.0"
description = "AI Brain for AgentSync"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.11,<3.0",
    "fastapi>=0.100,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "api*", "transport*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", ".."]
testpaths = ["tests"]
